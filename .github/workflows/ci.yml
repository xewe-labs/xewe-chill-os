# ci.yml: build + host tests on every push and pull request; release on a version tag.
# The logic lives in xewe-os-tools (.github/workflows/, ci/README.md); this file only calls it.
name: ci
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-build.yml@main
    with:
      # lint (xewe format --check, brand-lint) is advisory until the whitespace commits land; true makes it fail the run
      strict_lint: false
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-release.yml@main
    with:
      publish_branch: true   # static/firmware/releases/<version>/ on the `releases` branch
